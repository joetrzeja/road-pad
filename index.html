<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Instructor Map</title>
  
  <!-- App Icon & PWA Web Manifest Links -->
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Instructor Map">
  <meta name="theme-color" content="#141821">

  <!-- Leaflet CSS & Map Rotation Plugin CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #141821; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    #draw-canvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
    
    /* Sharpen canvas rendering for high-DPI zoom */
    .leaflet-tile {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Toggle Floating Button */
    .toggle-bar-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 4;
      background: #007bff;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Collapsible Toolbar */
    .toolbar {
      position: absolute;
      top: 10px;
      right: 62px;
      z-index: 3;
      background: rgba(255,255,255,0.98);
      padding: 10px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: calc(100vw - 90px);
      align-items: center;
      border: 1px solid #e0e0e0;
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    }

    .toolbar.hidden {
      opacity: 0;
      transform: translateY(-15px);
      pointer-events: none;
      visibility: hidden;
    }

    .btn { padding: 9px 12px; border: none; background: #007bff; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn.active { background: #0056b3; }
    .btn-danger { background: #dc3545; }
    .btn-locate { background: #28a745; }
    .btn-reset { background: #6c757d; }
    .btn-car { background: #17a2b8; color: #fff; }
    
    .search-container { display: flex; gap: 4px; align-items: center; }
    .search-input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; width: 140px; outline: none; }
    .search-input:focus { border-color: #007bff; }

    .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.4); cursor: pointer; padding: 0; transition: transform 0.1s ease; }
    .color-btn.selected { border: 4px solid #000; transform: scale(1.1); box-shadow: 0 0 6px rgba(0,0,0,0.6); }
    .color-btn:active { transform: scale(0.95); }
    
    .rotate-container { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; padding: 0 4px; }
    .rotate-container input { width: 80px; height: 20px; }

    .custom-car-marker {
      background: transparent !important;
      border: none !important;
    }

    .car-container {
      position: relative;
      width: 50px;
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .car-svg-wrapper {
      width: 28px;
      height: 48px;
      transform-origin: center center;
    }

    .rotate-arm {
      display: none;
      position: absolute;
      top: -20px;
      width: 2px;
      height: 25px;
      background: #007bff;
      z-index: 1000;
    }

    .rotate-handle {
      position: absolute;
      top: -12px;
      left: -9px;
      width: 20px;
      height: 20px;
      background: #007bff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      touch-action: none;
    }

    .pin-btn {
      display: none;
      position: absolute;
      bottom: -15px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      z-index: 1000;
    }

    .car-container.selected .rotate-arm,
    .car-container.selected .pin-btn {
      display: block !important;
    }

    .car-container.pinned .rotate-arm {
      display: none !important;
    }
  </style>
</head>
<body>

  <button id="toggle-toolbar-btn" class="toggle-bar-btn" title="Toggle Toolbar">👁️</button>

  <div id="main-toolbar" class="toolbar">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Search road or postcode...">
      <button id="search-btn" class="btn">🔍</button>
    </div>

    <button id="locate-me" class="btn btn-locate">📍 Location</button>
    <button id="toggle-draw" class="btn">✏️ Draw: OFF</button>
    <button id="add-car" class="btn btn-car">🚘 +Car</button>
    
    <button class="color-btn selected" style="background: red;" data-color="red"></button>
    <button class="color-btn" style="background: #0066ff;" data-color="#0066ff"></button>
    <button class="color-btn" style="background: #00cc44;" data-color="#00cc44"></button>
    <button class="color-btn" style="background: #ffcc00;" data-color="#ffcc00"></button>
    <button class="color-btn" style="background: #ff6600;" data-color="#ff6600"></button>
    <button class="color-btn" style="background: #9933ff;" data-color="#9933ff"></button>
    <button class="color-btn" style="background: #000000;" data-color="#000000"></button>

    <button id="clear-draw" class="btn btn-danger">Clear</button>

    <div class="rotate-container">
      🧭 <input type="range" id="rotate-slider" min="0" max="360" value="0">
      <button id="reset-north" class="btn btn-reset">⬆️ North</button>
    </div>
  </div>

  <div id="map"></div>
  <canvas id="draw-canvas"></canvas>

  <script>
    const toggleToolbarBtn = document.getElementById('toggle-toolbar-btn');
    const mainToolbar = document.getElementById('main-toolbar');

    toggleToolbarBtn.addEventListener('click', () => {
      mainToolbar.classList.toggle('hidden');
      toggleToolbarBtn.innerText = mainToolbar.classList.contains('hidden') ? '👁️‍🗨️' : '👁️';
    });

    const map = L.map('map', {
      rotate: true,
      touchRotate: true,
      bearing: 0,
      zoomControl: false,
      maxZoom: 21
    }).setView([51.7356, 0.4685], 18);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Esri High-Resolution World Imagery
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxNativeZoom: 19,
      maxZoom: 21,
      detectRetina: true
    }).addTo(map);

    let userMarker = null;
    let carMarkers = [];

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      searchBtn.innerText = '⏳';
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const { lat, lon } = data[0];
          map.flyTo([parseFloat(lat), parseFloat(lon)], 19, { duration: 1.5 });
        } else {
          alert('Location not found. Try entering a specific road, roundabout name, or postcode.');
        }
      } catch (err) {
        alert('Search error. Please check internet connection.');
      } finally {
        searchBtn.innerText = '🔍';
      }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    document.getElementById('locate-me').addEventListener('click', () => {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            map.setView([latitude, longitude], 20);
            
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker([latitude, longitude], {
              radius: 9,
              fillColor: "#007bff",
              color: "#ffffff",
              weight: 3,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map);
          },
          () => {
            alert('Unable to retrieve position. Please check location permissions in Chrome.');
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }
    });

    const carColors = ['#e63946', '#0066ff', '#2a9d8f', '#e9c46a', '#f4a261', '#9b5de5', '#2b2d42'];
    let carColorIndex = 0;

    function getTopDownCarHTML(color) {
      return `
        <div class="car-container">
          <div class="rotate-arm">
            <div class="rotate-handle"></div>
          </div>
          <div class="car-svg-wrapper">
            <svg viewBox="0 0 40 70" width="28" height="48" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.7));">
              <rect x="4" y="2" width="32" height="66" rx="9" fill="${color}" stroke="#111" stroke-width="2"/>
              <path d="M 8 18 Q 20 12 32 18 L 30 26 Q 20 22 10 26 Z" fill="#1d2d44" opacity="0.95" stroke="#111" stroke-width="1"/>
              <path d="M 10 50 Q 20 53 30 50 L 29 56 Q 20 58 11 56 Z" fill="#1d2d44" opacity="0.95" stroke="#111" stroke-width="1"/>
              <rect x="9" y="26" width="22" height="24" rx="4" fill="${color}" stroke="#000" stroke-width="1" opacity="0.9"/>
              <rect x="1" y="16" width="3" height="6" rx="1" fill="${color}" stroke="#000" stroke-width="0.5"/>
              <rect x="36" y="16" width="3" height="6" rx="1" fill="${color}" stroke="#000" stroke-width="0.5"/>
              <rect x="6" y="3" width="6" height="3" rx="1" fill="#ffffff"/>
              <rect x="28" y="3" width="6" height="3" rx="1" fill="#ffffff"/>
              <rect x="6" y="64" width="6" height="3" rx="1" fill="#ff2222"/>
              <rect x="28" y="64" width="6" height="3" rx="1" fill="#ff2222"/>
            </svg>
          </div>
          <button class="pin-btn">📌 Pin</button>
        </div>
      `;
    }

    document.getElementById('add-car').addEventListener('click', () => {
      const color = carColors[carColorIndex % carColors.length];
      carColorIndex++;

      const customIcon = L.divIcon({
        html: getTopDownCarHTML(color),
        className: 'custom-car-marker',
        iconSize: [50, 100],
        iconAnchor: [25, 50]
      });

      const center = map.getCenter();
      const car = L.marker(center, {
        icon: customIcon,
        draggable: true
      }).addTo(map);

      car.carRotation = 0;
      car.isPinned = false;

      setTimeout(() => attachCarEvents(car), 100);
      carMarkers.push(car);
    });

    function deselectAllCars() {
      carMarkers.forEach(c => {
        const el = c.getElement();
        if (el) {
          const container = el.querySelector('.car-container');
          if (container) container.classList.remove('selected');
        }
      });
    }

    map.on('click', () => deselectAllCars());

    function attachCarEvents(car) {
      const el = car.getElement();
      if (!el) return;

      const container = el.querySelector('.car-container');
      const handle = el.querySelector('.rotate-handle');
      const wrapper = el.querySelector('.car-svg-wrapper');
      const pinBtn = el.querySelector('.pin-btn');

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        deselectAllCars();
        container.classList.add('selected');
      });

      pinBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        car.isPinned = !car.isPinned;
        if (car.isPinned) {
          car.dragging.disable();
          container.classList.add('pinned');
          pinBtn.innerText = '🔓 Unpin';
        } else {
          car.dragging.enable();
          container.classList.remove('pinned');
          pinBtn.innerText = '📌 Pin';
        }
      });

      let isRotating = false;

      const startRotate = (e) => {
        if (car.isPinned) return;
        e.stopPropagation();
        e.preventDefault();
        isRotating = true;
        map.dragging.disable();
      };

      const doRotate = (e) => {
        if (!isRotating) return;
        e.stopPropagation();

        const rect = wrapper.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const radians = Math.atan2(clientX - centerX, -(clientY - centerY));
        let degrees = Math.round(radians * (180 / Math.PI));

        car.carRotation = degrees;
        wrapper.style.transform = `rotate(${degrees}deg)`;
      };

      const stopRotate = (e) => {
        if (isRotating) {
          isRotating = false;
          if (!isDrawingMode && !car.isPinned) map.dragging.enable();
        }
      };

      handle.addEventListener('mousedown', startRotate);
      handle.addEventListener('touchstart', startRotate);

      window.addEventListener('mousemove', doRotate);
      window.addEventListener('touchmove', doRotate);

      window.addEventListener('mouseup', stopRotate);
      window.addEventListener('touchend', stopRotate);

      el.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        map.removeLayer(car);
        carMarkers = carMarkers.filter(c => c !== car);
      });
    }

    const rotateSlider = document.getElementById('rotate-slider');
    const resetNorthBtn = document.getElementById('reset-north');

    rotateSlider.addEventListener('input', (e) => {
      map.setBearing(e.target.value);
    });

    resetNorthBtn.addEventListener('click', () => {
      map.setBearing(0);
      rotateSlider.value = 0;
    });

    map.on('rotate', () => {
      rotateSlider.value = map.getBearing();
    });

    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawingMode = false;
    let isPainting = false;
    let currentColor = 'red';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const drawBtn = document.getElementById('toggle-draw');
    drawBtn.addEventListener('click', () => {
      isDrawingMode = !isDrawingMode;
      canvas.style.pointerEvents = isDrawingMode ? 'auto' : 'none';
      drawBtn.innerText = isDrawingMode ? '✏️ Draw: ON' : '✏️ Draw: OFF';
      drawBtn.classList.toggle('active', isDrawingMode);
      
      if (isDrawingMode) {
        deselectAllCars();
        map.dragging.disable();
        map.touchRotate.disable();
        carMarkers.forEach(c => c.dragging.disable());
      } else {
        map.dragging.enable();
        map.touchRotate.enable();
        carMarkers.forEach(c => {
          if (!c.isPinned) c.dragging.enable();
        });
      }
    });

    const colorButtons = document.querySelectorAll('.color-btn');
    colorButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorButtons.forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    document.getElementById('clear-draw').onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      carMarkers.forEach(c => map.removeLayer(c));
      carMarkers = [];
      carColorIndex = 0;
    };

    function startPosition(e) {
      if (!isDrawingMode) return;
      isPainting = true;
      ctx.beginPath();
      draw(e);
    }
    function finishedPosition() {
      if (!isPainting) return;
      isPainting = false;
    }
    function draw(e) {
      if (!isPainting || !isDrawingMode) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = currentColor;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e); });
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
  </script>
</body>
</html>
