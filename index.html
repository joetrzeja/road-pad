<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Road Pad Instructor</title>
  
  <!-- App Icon & PWA Web Manifest Links -->
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Road Pad">
  <meta name="theme-color" content="#141821">

  <!-- Leaflet CSS & Map Rotation Plugin CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background-color: #141821; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    #draw-canvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
    .toolbar { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(255,255,255,0.98); padding: 10px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); max-width: 90vw; align-items: center; border: 1px solid #e0e0e0; }
    .btn { padding: 9px 12px; border: none; background: #007bff; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn.active { background: #0056b3; }
    .btn-danger { background: #dc3545; }
    .btn-locate { background: #28a745; }
    .btn-reset { background: #6c757d; }
    
    /* Color Swatch Buttons */
    .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.4); cursor: pointer; padding: 0; transition: transform 0.1s ease; }
    .color-btn.selected { border: 4px solid #000; transform: scale(1.1); box-shadow: 0 0 6px rgba(0,0,0,0.6); }
    .color-btn:active { transform: scale(0.95); }
    
    .rotate-container { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; padding: 0 4px; }
    .rotate-container input { width: 90px; height: 20px; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="locate-me" class="btn btn-locate">📍 Location</button>
    <button id="toggle-draw" class="btn">✏️ Draw: OFF</button>
    
    <!-- 7 Color Palette -->
    <button class="color-btn selected" style="background: red;" data-color="red"></button>
    <button class="color-btn" style="background: #0066ff;" data-color="#0066ff"></button>
    <button class="color-btn" style="background: #00cc44;" data-color="#00cc44"></button>
    <button class="color-btn" style="background: #ffcc00;" data-color="#ffcc00"></button>
    <button class="color-btn" style="background: #ff6600;" data-color="#ff6600"></button>
    <button class="color-btn" style="background: #9933ff;" data-color="#9933ff"></button>
    <button class="color-btn" style="background: #000000;" data-color="#000000"></button>

    <button id="clear-draw" class="btn btn-danger">Clear</button>

    <!-- Rotation Controls -->
    <div class="rotate-container">
      🧭 <input type="range" id="rotate-slider" min="0" max="360" value="0">
      <button id="reset-north" class="btn btn-reset">⬆️ North</button>
    </div>
  </div>

  <div id="map"></div>
  <canvas id="draw-canvas"></canvas>

  <script>
    // Initialize Rotatable Satellite Map with Increased Max Zoom (21)
    const map = L.map('map', {
      rotate: true,
      touchRotate: true,
      bearing: 0,
      zoomControl: false,
      maxZoom: 21
    }).setView([51.7356, 0.4685], 18);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Esri World Imagery with smooth upscaling up to level 21
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxNativeZoom: 19,
      maxZoom: 21
    }).addTo(map);

    let userMarker = null;

    // GPS Geolocation (Centers at max close-up zoom 20)
    document.getElementById('locate-me').addEventListener('click', () => {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            map.setView([latitude, longitude], 20);
            
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker([latitude, longitude], {
              radius: 9,
              fillColor: "#007bff",
              color: "#ffffff",
              weight: 3,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map);
          },
          () => {
            alert('Unable to retrieve position. Please check location permissions in Chrome.');
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }
    });

    // Map Orientation / Rotation Controls
    const rotateSlider = document.getElementById('rotate-slider');
    const resetNorthBtn = document.getElementById('reset-north');

    rotateSlider.addEventListener('input', (e) => {
      map.setBearing(e.target.value);
    });

    resetNorthBtn.addEventListener('click', () => {
      map.setBearing(0);
      rotateSlider.value = 0;
    });

    map.on('rotate', () => {
      rotateSlider.value = map.getBearing();
    });

    // Drawing Canvas
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawingMode = false;
    let isPainting = false;
    let currentColor = 'red';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const drawBtn = document.getElementById('toggle-draw');
    drawBtn.addEventListener('click', () => {
      isDrawingMode = !isDrawingMode;
      canvas.style.pointerEvents = isDrawingMode ? 'auto' : 'none';
      drawBtn.innerText = isDrawingMode ? '✏️ Draw: ON' : '✏️ Draw: OFF';
      drawBtn.classList.toggle('active', isDrawingMode);
      
      if (isDrawingMode) {
        map.dragging.disable();
        map.touchRotate.disable();
      } else {
        map.dragging.enable();
        map.touchRotate.enable();
      }
    });

    // Color Selector
    const colorButtons = document.querySelectorAll('.color-btn');
    colorButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorButtons.forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    document.getElementById('clear-draw').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Touch Drawing Handlers
    function startPosition(e) {
      if (!isDrawingMode) return;
      isPainting = true;
      ctx.beginPath();
      draw(e);
    }
    function finishedPosition() {
      if (!isPainting) return;
      isPainting = false;
    }
    function draw(e) {
      if (!isPainting || !isDrawingMode) return;
      
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = currentColor;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', finishedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e); });
    canvas.addEventListener('touchend', finishedPosition);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
  </script>
</body>
</html>
